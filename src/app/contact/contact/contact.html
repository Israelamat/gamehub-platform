<div class="contact-container">
  <div class="contact-card" reveal anim="fade-up">

    <h1 class="contact-title">Contact Us</h1>
    <p class="contact-subtitle">Got questions, feedback or issues? Send us a message</p>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">

      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name" placeholder="Your name"
          [class.error]="contactForm.get('name')?.touched && contactForm.get('name')?.invalid">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="your@email.com"
          [class.error]="contactForm.get('email')?.touched && contactForm.get('email')?.invalid">
      </div>

      <div class="form-group">
        <label>Subject</label>
        <input type="text" formControlName="subject" placeholder="Message subject"
          [class.error]="contactForm.get('subject')?.touched && contactForm.get('subject')?.invalid">
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea rows="5" formControlName="message" placeholder="Write your message..."
          [class.error]="contactForm.get('message')?.touched && contactForm.get('message')?.invalid"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="contactForm.invalid || loading">
          <i class="bi bi-send"></i>
          @if (loading) {
          Sending...
          } @else {
          Send Message
          }
        </button>

      </div>

    </form>
  </div>
</div>
