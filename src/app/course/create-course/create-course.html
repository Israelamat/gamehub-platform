<div class="create-container">
  <div class="create-card">
    <h1>Create New Course</h1>
    <p>Fill the information below to publish a new course</p>

    <form [formGroup]="publishForm" (ngSubmit)="onSubmit()" class="create-form">

      <div class="form-group">
        <label>Title</label>
        <input type="text" formControlName="title" placeholder="Ej: From Zero to Hero in Godot"
          [class.error]="publishForm.get('title')?.touched && publishForm.get('title')?.invalid">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="content" placeholder="Explain your course...">
        </textarea>
      </div>

      <div class="form-group">
        <label>Price (€)</label>
        <input type="number" formControlName="price" placeholder="0 = free">
      </div>

      <div class="form-group">
        <label>Duration (hours)</label>
        <input type="number" formControlName="duration" min="1" placeholder="Ej: 10">
      </div>

      <div class="form-group">
        <label>Course Image</label>
        <input type="file" encodeBase64 (encoded)="onFileChange($event)" />
        <small>Upload an image from your device</small>
        @if (imagePreview()) {
        <img [src]="imagePreview()" class="preview" />
        }
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/courses">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="publishForm.invalid">
          Publish Course
        </button>
      </div>
    </form>
  </div>
</div>
